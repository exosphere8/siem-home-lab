[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "siemlab"
version = "0.1.0"
description = "Toolkit for the SIEM home lab: Wazuh alert correlation, incident reports, detection validation and synthetic alert generation."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Midnight Croissant" }]
keywords = ["siem", "wazuh", "sigma", "detection-engineering", "incident-response", "soc"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: System :: Logging",
    "Typing :: Typed",
]
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
sigma = ["pysigma>=0.11"]
dev = [
    "pysigma>=0.11",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML",
]

[project.scripts]
siemlab = "siemlab.cli:main"

[project.urls]
Homepage = "https://github.com/exosphere8/siem-home-lab"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
siemlab = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.coverage.run]
source = ["siemlab"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 90
exclude_also = ["if __name__ == .__main__.:", "raise AssertionError"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PT", "RET", "C4"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["sigma.*"]
ignore_missing_imports = true
