[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "siemlab"
dynamic = ["version"]
description = "Detection engineering toolkit for Wazuh 4 and 5: validate rules, deploy a Wazuh 5 content pack, correlate alerts into incidents, and build a home SOC lab."
readme = { file = "docs/package-readme.md", content-type = "text/markdown" }
requires-python = ">=3.11"
license = "PolyForm-Noncommercial-1.0.0 OR LicenseRef-siemlab-Commercial"
license-files = ["LICENSE", "COMMERCIAL-LICENSE.md", "THIRD_PARTY_NOTICES.md"]
authors = [{ name = "Midnight Croissant", email = "101312106+exosphere8@users.noreply.github.com" }]
maintainers = [
    { name = "Midnight Croissant", email = "101312106+exosphere8@users.noreply.github.com" },
]
keywords = [
    "siem",
    "wazuh",
    "sigma",
    "detection-engineering",
    "incident-response",
    "soc",
    "mitre-attack",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: System :: Logging",
    "Topic :: System :: Monitoring",
    "Typing :: Typed",
]
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
sigma = ["pysigma>=0.11"]
dev = [
    "build>=1.2",
    "twine>=6",
    "pysigma>=0.11",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML",
]

[project.scripts]
siemlab = "siemlab.cli:main"

[project.urls]
Homepage = "https://github.com/exosphere8/siem-home-lab"
Documentation = "https://github.com/exosphere8/siem-home-lab/tree/main/docs"
Changelog = "https://github.com/exosphere8/siem-home-lab/blob/main/CHANGELOG.md"
Issues = "https://github.com/exosphere8/siem-home-lab/issues"
Source = "https://github.com/exosphere8/siem-home-lab"

[tool.setuptools.dynamic]
version = { attr = "siemlab.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
siemlab = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.coverage.run]
source = ["siemlab"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 90
exclude_also = ["if __name__ == .__main__.:", "raise AssertionError"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PT", "RET", "C4"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["sigma.*"]
ignore_missing_imports = true
