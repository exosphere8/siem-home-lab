name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detections:
    name: Validate detections
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Wazuh Common Schema field list (pinned SHA-256)
        run: siemlab wazuh5 fetch-schema
      - name: Wazuh XML, Sigma (pySigma), Suricata rules and the Wazuh 5 pack
        run: siemlab validate --strict
      - name: Coverage matrix is up to date
        run: siemlab coverage --check docs/detection-coverage.md
      - name: Synthetic samples match the current rules
        run: |
          siemlab generate --out /tmp/alerts.json
          diff -u sample-data/sanitized/alerts-synthetic.json /tmp/alerts.json
          siemlab generate --format wazuh5 --out /tmp/findings.json
          diff -u sample-data/sanitized/findings-wazuh5-synthetic.json /tmp/findings.json
      - name: Wazuh 5 pack bundles for the Content Manager API
        run: siemlab wazuh5 bundle --out /tmp/wazuh5-bundle

  python:
    name: siemlab (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: mypy
      - name: Tests (warnings are errors, coverage gate 90%)
        run: pytest -W error --cov --cov-report=term-missing

  scripts:
    name: Shell and PowerShell analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: ShellCheck
        run: find scripts -name '*.sh' -print0 | xargs -0 shellcheck --severity=style
      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name PSScriptAnalyzer -Scope CurrentUser -Force
          $results = Invoke-ScriptAnalyzer -Path scripts -Recurse -Severity Warning, Error
          $results | Format-Table -AutoSize RuleName, Severity, ScriptName, Line, Message
          if ($results) { throw "PSScriptAnalyzer reported $($results.Count) issue(s)" }

  package:
    name: Build and smoke-test the package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install build twine
      - name: Build sdist and wheel
        run: python -m build
      - name: Check package metadata
        run: twine check --strict dist/*
      - name: Install the wheel in a clean environment and run it outside the repository
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
          cd "$(mktemp -d)"
          /tmp/clean/bin/siemlab --version
          /tmp/clean/bin/siemlab demo
          /tmp/clean/bin/siemlab demo --wazuh5 --format json > /dev/null
          /tmp/clean/bin/siemlab wazuh5 fetch-schema
          /tmp/clean/bin/siemlab init lab
          cd lab
          /tmp/clean/bin/siemlab validate --strict
          /tmp/clean/bin/siemlab wazuh5 deploy --dry-run
          /tmp/clean/bin/siemlab wazuh5 monitors --dry-run
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  secrets:
    name: Secret scan (full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  wazuh4-live:
    name: Rules on a real Wazuh manager (logtest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install pyyaml
      - name: Start the official manager image at the pinned version
        run: |
          docker run -d --name wazuh "wazuh/wazuh-manager:$(cat configs/wazuh-version)"
          for i in $(seq 1 60); do docker exec wazuh test -S /var/ossec/queue/sockets/logtest && break; sleep 5; done
          docker exec wazuh test -S /var/ossec/queue/sockets/logtest
      - name: Deploy the rules with deploy-rules.sh (validates with wazuh-analysisd -t)
        run: |
          docker exec wazuh mkdir -p /root/lab/scripts /root/lab/configs
          docker cp detections wazuh:/root/lab/detections
          docker cp scripts/deploy wazuh:/root/lab/scripts/deploy
          docker cp configs/wazuh-version wazuh:/root/lab/configs/wazuh-version
          docker exec wazuh bash /root/lab/scripts/deploy/deploy-rules.sh
          sleep 10
          for i in $(seq 1 30); do docker exec wazuh test -S /var/ossec/queue/sockets/logtest && break; sleep 3; done
      - name: Every logtest case matches its rule
        run: |
          python -c "import json,yaml;print(json.dumps(yaml.safe_load(open('detections/logtest/wazuh4.yml'))))" > /tmp/cases.json
          docker cp /tmp/cases.json wazuh:/tmp/cases.json
          docker cp src/siemlab/logtest4.py wazuh:/tmp/logtest4.py
          docker exec wazuh /var/ossec/framework/python/bin/python3 /tmp/logtest4.py --cases /tmp/cases.json
      - name: Manager log
        if: failure()
        run: docker exec wazuh tail -n 80 /var/ossec/logs/ossec.log

  suricata-live:
    name: Lab signatures load in real Suricata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update -q && sudo apt-get install -y -q suricata
      - run: sudo suricata -T -c /etc/suricata/suricata.yaml -S detections/network/suricata-local.rules -l /tmp
