<!--
  Additions to /var/ossec/etc/ossec.conf on ubuntu-endpoint.
  Merge these blocks into the existing file (keep the defaults that are already there),
  then: sudo systemctl restart wazuh-agent

  Used by projects 2 (SSH), 4 (FIM), 5 (accounts), 6 (Nginx) and 7 (Suricata).
-->
<ossec_config>

  <client>
    <server>
      <address>10.10.10.10</address>
      <port>1514</port>
      <protocol>tcp</protocol>
    </server>
  </client>

  <!-- Projects 2 and 5: sshd, sudo, useradd, usermod and gpasswd all write here. -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/auth.log</location>
  </localfile>

  <!-- Project 6: Nginx in the default combined format. -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/nginx/access.log</location>
  </localfile>
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/nginx/error.log</location>
  </localfile>

  <!-- Project 7 (optional): Suricata alerts. -->
  <localfile>
    <log_format>json</log_format>
    <location>/var/log/suricata/eve.json</location>
  </localfile>

  <!-- Project 4: file-integrity monitoring, in real time for the paths attackers change. -->
  <syscheck>
    <frequency>43200</frequency>

    <!-- Real-time (inotify) mode only works on directories. Single files use whodata
         (auditd), which also records which user and process made the change.
         Requires: sudo apt-get install -y auditd -->

    <!-- Account databases: never report_changes here, or password hashes would end up in alerts. -->
    <directories whodata="yes" check_all="yes">/etc/passwd,/etc/shadow,/etc/group,/etc/gshadow</directories>

    <!-- Privilege, scheduling and service configuration: diffs are useful and not secret. -->
    <directories whodata="yes" check_all="yes" report_changes="yes">/etc/sudoers,/etc/crontab</directories>
    <directories realtime="yes" check_all="yes" report_changes="yes">/etc/sudoers.d</directories>
    <directories realtime="yes" check_all="yes" report_changes="yes">/etc/cron.d,/etc/cron.hourly,/etc/cron.daily,/etc/cron.weekly,/etc/cron.monthly,/var/spool/cron</directories>
    <directories realtime="yes" check_all="yes" report_changes="yes">/etc/systemd/system,/usr/lib/systemd/system</directories>

    <!-- SSH keys only, not everything under /home. -->
    <directories realtime="yes" check_all="yes" restrict="authorized_keys">/root/.ssh,/home</directories>

    <!-- Web root. -->
    <directories realtime="yes" check_all="yes" report_changes="yes">/var/www</directories>
  </syscheck>

</ossec_config>
