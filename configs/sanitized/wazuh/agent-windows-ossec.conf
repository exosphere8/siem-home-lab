<!--
  Additions to C:\Program Files (x86)\ossec-agent\ossec.conf on win11-endpoint.
  Merge these blocks into the existing file, then restart the agent:
      Restart-Service -Name WazuhSvc

  Used by projects 3 (Windows authentication) and 4 (FIM).
  The audit policy that makes Windows log the events is set by
  scripts/windows/Enable-LabAuditPolicy.ps1.
-->
<ossec_config>

  <client>
    <server>
      <address>10.10.10.10</address>
      <port>1514</port>
      <protocol>tcp</protocol>
    </server>
  </client>

  <!-- Project 3: the Security channel is collected by default; kept here for clarity. -->
  <localfile>
    <location>Security</location>
    <log_format>eventchannel</log_format>
  </localfile>

  <!-- Project 4: Startup folders are a classic persistence location (rule 100350). -->
  <syscheck>
    <directories realtime="yes" check_all="yes">%PROGRAMDATA%\Microsoft\Windows\Start Menu\Programs\Startup</directories>
    <directories realtime="yes" check_all="yes">C:\Users\*\AppData\Roaming\Microsoft\Windows\Start Menu\Programs\Startup</directories>
    <!-- IIS web root (rule 100351). Only matters if IIS is installed on the endpoint. -->
    <directories realtime="yes" check_all="yes" report_changes="yes">C:\inetpub\wwwroot</directories>
  </syscheck>

</ossec_config>
