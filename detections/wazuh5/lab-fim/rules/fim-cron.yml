metadata:
  title: FIM scheduled job changed
  author: Midnight Croissant
  date: '2026-10-07'
  description: A change to the system crontab, a cron directory or a user crontab.
  references:
  - Migrated from Wazuh 4.x rule 100303
status: experimental
level: high
enabled: true
logsource:
  product: lab-fim
detection:
  condition: selection
  selection:
    file.path|re: ^/(etc/crontab$|etc/cron\.(d|hourly|daily|weekly|monthly)/|var/spool/cron/)
tags:
- attack.persistence
- attack.t1053.003
falsepositives:
- Package updates that install cron jobs
mitre:
  tactic:
    id:
    - TA0003
    name:
    - Persistence
  technique:
    id:
    - T1053
    name:
    - Scheduled Task/Job
  subtechnique:
    id:
    - T1053.003
    name:
    - 'Scheduled Task/Job: Cron'
