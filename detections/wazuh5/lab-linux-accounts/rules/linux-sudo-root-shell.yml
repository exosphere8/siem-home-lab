metadata:
  title: Linux interactive root shell via sudo
  author: Midnight Croissant
  date: '2026-10-07'
  description: sudo started a shell or su as root, rather than running one command.
  references:
  - Migrated from Wazuh 4.x rule 100402
status: experimental
level: high
enabled: true
logsource:
  product: lab-linux-accounts
detection:
  condition: selection
  selection:
    process.name: sudo
    message|re: COMMAND=(/usr)?/bin/((ba|z|da|k|fi)?sh|su)(\s|$)
tags:
- attack.privilege-escalation
- attack.t1548.003
falsepositives:
- Administrators who work in a root shell
mitre:
  tactic:
    id:
    - TA0004
    name:
    - Privilege Escalation
  technique:
    id:
    - T1548
    name:
    - Abuse Elevation Control Mechanism
  subtechnique:
    id:
    - T1548.003
    name:
    - 'Abuse Elevation Control Mechanism: Sudo and Sudo Caching'
