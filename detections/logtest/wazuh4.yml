# Logtest cases for the Wazuh 4.x rules: `sudo siemlab wazuh4 logtest` on the manager.
# Each case runs its events in one logtest session and checks the rule the last event ends
# on. Windows cases and `mode: queue` cases go through the manager's analysis queue
# instead (logtest cannot decode Event Channel). CI runs every case on the official
# wazuh/wazuh-manager image. File-integrity rules (100300-100351) need real syscheck
# events and are validated live (Project 4).
cases:
- name: SSH failed login
  location: /var/log/auth.log
  log_format: syslog
  events:
  - 'Oct  5 10:00:01 ubuntu-endpoint sshd[2301]: Failed password for labadmin from 10.10.10.50 port 40001 ssh2'
  expect:
    rule: 100100
    level: 5
- name: SSH failed login as root
  location: /var/log/auth.log
  log_format: syslog
  events:
  - 'Oct  5 10:00:01 ubuntu-endpoint sshd[2301]: Failed password for root from 10.10.10.50 port 40002 ssh2'
  expect:
    rule: 100103
    level: 8
- name: Six root-only failures are a brute force
  location: /var/log/auth.log
  log_format: syslog
  events:
  - 'Oct  5 10:00:01 ubuntu-endpoint sshd[2301]: Failed password for root from 10.10.10.50 port 40010 ssh2'
  - 'Oct  5 10:00:01 ubuntu-endpoint sshd[2301]: Failed password for root from 10.10.10.50 port 40011 ssh2'
  - 'Oct  5 10:00:01 ubuntu-endpoint sshd[2301]: Failed password for root from 10.10.10.50 port 40012 ssh2'
  - 'Oct  5 10:00:01 ubuntu-endpoint sshd[2301]: Failed password for root from 10.10.10.50 port 40013 ssh2'
  - 'Oct  5 10:00:01 ubuntu-endpoint sshd[2301]: Failed password for root from 10.10.10.50 port 40014 ssh2'
  - 'Oct  5 10:00:01 ubuntu-endpoint sshd[2301]: Failed password for root from 10.10.10.50 port 40015 ssh2'
  expect:
    rule: 100107
    level: 10
- name: Six non-root failures are a brute force
  location: /var/log/auth.log
  log_format: syslog
  events:
  - 'Oct  5 10:00:01 ubuntu-endpoint sshd[2301]: Failed password for labadmin from 10.10.10.50 port 40020 ssh2'
  - 'Oct  5 10:00:01 ubuntu-endpoint sshd[2301]: Failed password for admin from 10.10.10.50 port 40021 ssh2'
  - 'Oct  5 10:00:01 ubuntu-endpoint sshd[2301]: Failed password for deploy from 10.10.10.50 port 40022 ssh2'
  - 'Oct  5 10:00:01 ubuntu-endpoint sshd[2301]: Failed password for labadmin from 10.10.10.50 port 40023 ssh2'
  - 'Oct  5 10:00:01 ubuntu-endpoint sshd[2301]: Failed password for admin from 10.10.10.50 port 40024 ssh2'
  - 'Oct  5 10:00:01 ubuntu-endpoint sshd[2301]: Failed password for deploy from 10.10.10.50 port 40025 ssh2'
  expect:
    rule: 100101
    level: 10
- name: 'Mixed attack: the 6th counted failure fires, root or not'
  location: /var/log/auth.log
  log_format: syslog
  events:
  - 'Oct  5 10:00:01 ubuntu-endpoint sshd[2301]: Failed password for labadmin from 10.10.10.50 port 40040 ssh2'
  - 'Oct  5 10:00:01 ubuntu-endpoint sshd[2301]: Failed password for root from 10.10.10.50 port 40041 ssh2'
  - 'Oct  5 10:00:01 ubuntu-endpoint sshd[2301]: Failed password for labadmin from 10.10.10.50 port 40042 ssh2'
  - 'Oct  5 10:00:01 ubuntu-endpoint sshd[2301]: Failed password for root from 10.10.10.50 port 40043 ssh2'
  - 'Oct  5 10:00:01 ubuntu-endpoint sshd[2301]: Failed password for labadmin from 10.10.10.50 port 40044 ssh2'
  - 'Oct  5 10:00:01 ubuntu-endpoint sshd[2301]: Failed password for root from 10.10.10.50 port 40045 ssh2'
  - 'Oct  5 10:00:01 ubuntu-endpoint sshd[2301]: Failed password for labadmin from 10.10.10.50 port 40046 ssh2'
  - 'Oct  5 10:00:01 ubuntu-endpoint sshd[2301]: Failed password for root from 10.10.10.50 port 40047 ssh2'
  - 'Oct  5 10:00:01 ubuntu-endpoint sshd[2301]: Failed password for labadmin from 10.10.10.50 port 40048 ssh2'
  - 'Oct  5 10:00:01 ubuntu-endpoint sshd[2301]: Failed password for root from 10.10.10.50 port 40049 ssh2'
  expect:
    rule: 100101
    level: 10
- name: Login after a root brute force
  location: /var/log/auth.log
  log_format: syslog
