  expect:
    rule: 100401
    level: 12
- name: Root shell via sudo
  location: /var/log/auth.log
  log_format: syslog
  events:
  - 'Oct  5 10:12:30 ubuntu-endpoint sudo:  labadmin : TTY=pts/0 ; PWD=/home/labadmin ; USER=root ; COMMAND=/bin/bash'
  expect:
    rule: 100402
    level: 10
- name: Repeated sudo password failures
  location: /var/log/auth.log
  log_format: syslog
